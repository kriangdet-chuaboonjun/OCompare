[package]
name = "o-compare-rust"
version = "0.4.2"
edition = "2021"
description = "Side-by-side text compare"
license = "LicenseRef-Proprietary"

[lib]
name = "o_compare_rust"
crate-type = ["rlib"]

[[bin]]
name = "o-compare-rust"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
chardetng = "1"
notify = "8"
tempfile = "3"
sha2 = "0.10"
regex = "1"
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
